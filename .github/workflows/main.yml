name: Aggregator mirror

on:
  repository_dispatch:
    types: [mirror_push]
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo (ignored if sync_all is true)"
        required: false
        default: "LeapXD/kicks"
      sync_all:
        description: "Sync all four repos (kick-start, kicks, kicks-editor, kicks-plugins)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aggregate-mirror
  cancel-in-progress: false

env:
  DEST_BRANCH: default    # Always push to 'default' in destination
  SRC_REF: master         # Always pull from 'master' in sources

jobs:
  # === Manual "sync all" fan-out ===
  fanout:
    if: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.sync_all) == true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1    # serialize pushes to avoid conflicts
      matrix:
        repo: [ "LeapXD/kick-start", "LeapXD/kicks", "LeapXD/kicks-editor", "LeapXD/kicks-plugins" ]

    steps:
      - name: Checkout destination repo@default
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEST_BRANCH }}

      - name: Map repo → destination path
        id: map
        run: |
          set -euo pipefail
          REPO="${{ matrix.repo }}"
          case "$REPO" in
            LeapXD/kick-start)   DEST_PATH="wp-content/themes/kick-start";   DELETE_MODE="--delete" ;;
            LeapXD/kicks)        DEST_PATH="wp-content/themes/kicks";        DELETE_MODE="--delete" ;;
            LeapXD/kicks-editor) DEST_PATH="wp-content/plugins/kicks-editor";DELETE_MODE="--delete" ;;
            LeapXD/kicks-plugins)DEST_PATH="wp-content/plugins";             DELETE_MODE="" ;;
            *) echo "Unknown repo: $REPO"; exit 64 ;;
          esac
          echo "repo=$REPO"                  >> "$GITHUB_OUTPUT"
          echo "dest_path=${DEST_PATH}"      >> "$GITHUB_OUTPUT"
          echo "delete_mode=${DELETE_MODE}"  >> "$GITHUB_OUTPUT"

      - name: Checkout source repo@master
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.map.outputs.repo }}
          ref: ${{ env.SRC_REF }}   # always master
          path: source
          submodules: false
          token: ${{ secrets.MIRROR_READ_TOKEN }}

      - name: Strip submodules (if present)
        working-directory: source
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --get-regexp path | awk '{print $2}' | while read -r p; do
              rm -rf -- "$p"
            done
            rm -f .gitmodules
          fi

      - name: Prepare export tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          rsync -a \
            --exclude='.git' \
            --exclude='.gitmodules' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            source/ /tmp/export/

      - name: Copy into destination path
        run: |
          set -euo pipefail
          DEST="${{ steps.map.outputs.dest_path }}"
          mkdir -p "$DEST"
          rsync -a ${{ steps.map.outputs.delete_mode }} /tmp/export/ "$DEST/"

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git add -A
          SRC="${{ steps.map.outputs.repo }}"
          REF="${{ env.SRC_REF }}"
          DEST_PATH="${{ steps.map.outputs.dest_path }}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Mirror ${SRC}@${REF} → ${DEST_PATH}"
          git pull --rebase origin "$DEST_BRANCH" || true
          git push origin "$DEST_BRANCH"

  # === Single-repo path (manual or repository_dispatch) ===
  pull-and-commit:
    if: ${{ !(github.event_name == 'workflow_dispatch' && fromJSON(inputs.sync_all) == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repo@default
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEST_BRANCH }}

      - name: Select payload (force master)
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SRC_REPO="${{ inputs.repo }}"
          else
            SRC_REPO="${{ github.event.client_payload.repo }}"
          fi
          echo "repo=${SRC_REPO}" >> "$GITHUB_OUTPUT"
          echo "ref=${SRC_REF}"   >> "$GITHUB_OUTPUT"   # always master via env

      - name: Map repo → destination path
        id: map
        run: |
          set -euo pipefail
          REPO="${{ steps.payload.outputs.repo }}"
          case "$REPO" in
            LeapXD/kick-start)   DEST_PATH="wp-content/themes/kick-start";   DELETE_MODE="--delete" ;;
            LeapXD/kicks)        DEST_PATH="wp-content/themes/kicks";        DELETE_MODE="--delete" ;;
            LeapXD/kicks-editor) DEST_PATH="wp-content/plugins/kicks-editor";DELETE_MODE="--delete" ;;
            LeapXD/kicks-plugins)DEST_PATH="wp-content/plugins";             DELETE_MODE="" ;;
            *) echo "Unknown repo: $REPO"; exit 64 ;;
          esac
          echo "dest_path=${DEST_PATH}"     >> "$GITHUB_OUTPUT"
          echo "delete_mode=${DELETE_MODE}" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo@master
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.payload.outputs.repo }}
          ref: ${{ steps.payload.outputs.ref }}   # 'master' from above
          path: source
          submodules: false
          token: ${{ secrets.MIRROR_READ_TOKEN }}

      - name: Strip submodules (if present)
        working-directory: source
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --get-regexp path | awk '{print $2}' | while read -r p; do
              rm -rf -- "$p"
            done
            rm -f .gitmodules
          fi

      - name: Prepare export tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/export
          rsync -a \
            --exclude='.git' \
            --exclude='.gitmodules' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            source/ /tmp/export/

      - name: Copy into destination path
        run: |
          set -euo pipefail
          DEST="${{ steps.map.outputs.dest_path }}"
          mkdir -p "$DEST"
          rsync -a ${{ steps.map.outputs.delete_mode }} /tmp/export/ "$DEST/"

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git add -A
          SRC="${{ steps.payload.outputs.repo }}"
          REF="${{ steps.payload.outputs.ref }}"
          DEST_PATH="${{ steps.map.outputs.dest_path }}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Mirror ${SRC}@${REF} → ${DEST_PATH}"
          git pull --rebase origin "$DEST_BRANCH" || true
          git push origin "$DEST_BRANCH"
