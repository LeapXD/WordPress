name: Aggregator mirror

on:
  repository_dispatch:
    types: [mirror_push]
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo (ignored if sync_all is true)"
        required: false
        default: "LeapXD/kicks"
      ref:
        description: "Branch or tag in source (e.g., master)"
        required: true
        default: "master"
      sync_all:
        description: "Sync all four repos (kick-start, kicks, kicks-editor, kicks-plugins)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aggregate-mirror
  cancel-in-progress: false

jobs:
  # === Manual "sync all" fan-out button ===
  fanout:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_all == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [ "LeapXD/kick-start", "LeapXD/kicks", "LeapXD/kicks-editor", "LeapXD/kicks-plugins" ]
    env:
      DEST_BRANCH: main
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEST_BRANCH }}

      - name: Map repo → destination path
        id: map
        run: |
          set -euo pipefail
          REPO="${{ matrix.repo }}"
          case "$REPO" in
            LeapXD/kick-start)
              DEST_PATH="wp-content/themes/kick-start"
              DELETE_MODE="--delete"
              ;;
            LeapXD/kicks)
              DEST_PATH="wp-content/themes/kicks"
              DELETE_MODE="--delete"
              ;;
            LeapXD/kicks-editor)
              DEST_PATH="wp-content/plugins/kicks-editor"
              DELETE_MODE="--delete"
              ;;
            LeapXD/kicks-plugins)
              DEST_PATH="wp-content/plugins"
              DELETE_MODE=""   # don't delete other plugins in plugins/
              ;;
            *)
              echo "Unknown repo: $REPO"
              exit 64
              ;;
          esac
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "dest_path=${DEST_PATH}" >>
